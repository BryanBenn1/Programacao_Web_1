<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário em HTML</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Formulário em HTML</h1>
    <form action="#" method="post">

        <fieldset>
            <legend>Cadastro do usuário</legend>
            <label for="nomeUser">Escreva o seu nome</label>
            <input type="text" required id="nomeUser" name="nome" placeholder="Digite seu nome">
            <br><br>
            <label for="UserEmail">Email de Contato</label> <!--Toda tag label é amarrada a uma tag input--> 
            <input type="email" id="UserEmail" name="email" required placeholder="Digite seu email">
            <br><br>
            <label for="userSenha">Senha</label>
            <input type="password" name="senha" id="userSenha" required placeholder="Digite sua senha">
            <br><br>
            <label for="userTel">Telefone 1</label>
            <input type="tel" required id="userTel" pattern="[0-9]{2} [0-9]{9}" placeholder="xx123456789">
            <br><br>
            <label for="userSexo">Selecione seu sexo</label>
            <br><br>
            <input type="radio" required id="masc" name="sexo" value="Masculino">
            <label for="masc">Masculino</label>
            <br><br>
            <input type="radio" required id="fem" name="sexo" value="Feminino">
            <label for="fem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Dados do Curso</legend>
        </fieldset>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
