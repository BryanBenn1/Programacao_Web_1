<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas HTML</title>
</head>
<body>
    <table border="3">
        <caption><b>Usuários Matriculados</b></caption>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Sexo</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td align="center">Gilmar</td>
                <td align="right">40</td>
                <td rowspan="4" align="center">M</td>
            </tr>
            <tr>
                <td align="center">Antonio</td>
                <td align="right">35</td>
                
            </tr>
            <tr>
                <td align="center">Zezin</td>
                <td align="right">23</td>
                
            </tr>
            <tr>
                <td align="center">Tonin</td>
                <td align="right">52</td>
                
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td><mark>Quantidade de Usuários</mark></td>
                <td colspan="2" align="right"><mark>4</mark></td>

            </tr>
        </tfoot>

    </table>
</body>
</html>
